openapi: 3.0.3
info:
  title: CRM 系统 API - 系统模块
  description: 企业级 CRM 系统系统管理模块 API
  version: 1.0.0

servers:
  - url: /api
    description: API 基础路径

tags:
  - name: 认证
    description: 用户认证相关接口
  - name: 用户管理
    description: 用户 CRUD 接口
  - name: 角色管理
    description: 角色 CRUD 接口
  - name: 部门管理
    description: 部门 CRUD 接口
  - name: 权限管理
    description: 权限 CRUD 接口

paths:
  # ==================== 认证 ====================
  /auth/login:
    post:
      tags: [认证]
      summary: 用户登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/logout:
    post:
      tags: [认证]
      summary: 用户登出
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /auth/refresh:
    post:
      tags: [认证]
      summary: 刷新 Token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/info:
    get:
      tags: [认证]
      summary: 获取当前用户信息
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'

  # ==================== 用户管理 ====================
  /users:
    get:
      tags: [用户管理]
      summary: 用户列表
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pageNum'
        - $ref: '#/components/parameters/pageSize'
        - name: username
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: integer
        - name: deptId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'

    post:
      tags: [用户管理]
      summary: 创建用户
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /users/{id}:
    get:
      tags: [用户管理]
      summary: 用户详情
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

    put:
      tags: [用户管理]
      summary: 更新用户
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

    delete:
      tags: [用户管理]
      summary: 删除用户
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /users/{id}/status:
    put:
      tags: [用户管理]
      summary: 更新用户状态
      operationId: updateUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /users/{id}/password:
    put:
      tags: [用户管理]
      summary: 重置密码
      operationId: resetPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  # ==================== 角色管理 ====================
  /roles:
    get:
      tags: [角色管理]
      summary: 角色列表
      operationId: listRoles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pageNum'
        - $ref: '#/components/parameters/pageSize'
        - name: roleName
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePageResponse'

    post:
      tags: [角色管理]
      summary: 创建角色
      operationId: createRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'

  /roles/{id}:
    get:
      tags: [角色管理]
      summary: 角色详情
      operationId: getRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'

    put:
      tags: [角色管理]
      summary: 更新角色
      operationId: updateRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'

    delete:
      tags: [角色管理]
      summary: 删除角色
      operationId: deleteRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  # ==================== 部门管理 ====================
  /departments:
    get:
      tags: [部门管理]
      summary: 部门树
      operationId: getDepartmentTree
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentTreeResponse'

    post:
      tags: [部门管理]
      summary: 创建部门
      operationId: createDepartment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreateRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'

  /departments/{id}:
    get:
      tags: [部门管理]
      summary: 部门详情
      operationId: getDepartment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'

    put:
      tags: [部门管理]
      summary: 更新部门
      operationId: updateDepartment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'

    delete:
      tags: [部门管理]
      summary: 删除部门
      operationId: deleteDepartment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  # ==================== 权限管理 ====================
  /permissions:
    get:
      tags: [权限管理]
      summary: 权限树
      operationId: getPermissionTree
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionTreeResponse'

    post:
      tags: [权限管理]
      summary: 创建权限
      operationId: createPermission
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionCreateRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    pageNum:
      name: pageNum
      in: query
      schema:
        type: integer
        default: 1
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 10

  schemas:
    Result:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: 操作成功
        data:
          type: object
        timestamp:
          type: integer
          format: int64

    PageResult:
      type: object
      properties:
        records:
          type: array
          items: {}
        total:
          type: integer
          format: int64
        pageNum:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
        pages:
          type: integer
          format: int64

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: "123456"

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                accessToken:
                  type: string
                refreshToken:
                  type: string
                expiresIn:
                  type: integer

    UserInfoResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string

    UserCreateRequest:
      type: object
      required: [username, password, deptId]
      properties:
        username:
          type: string
        password:
          type: string
        nickname:
          type: string
        email:
          type: string
        phone:
          type: string
        deptId:
          type: integer
          format: int64
        roleIds:
          type: array
          items:
            type: integer
            format: int64
        status:
          type: integer
          default: 1

    UserUpdateRequest:
      type: object
      properties:
        nickname:
          type: string
        email:
          type: string
        phone:
          type: string
        deptId:
          type: integer
          format: int64
        roleIds:
          type: array
          items:
            type: integer
            format: int64
        status:
          type: integer

    UserResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'

    UserPageResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    records:
                      type: array
                      items:
                        $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        email:
          type: string
        phone:
          type: string
        avatar:
          type: string
        deptId:
          type: integer
          format: int64
        deptName:
          type: string
        status:
          type: integer
        createTime:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    RoleCreateRequest:
      type: object
      required: [roleName, roleKey]
      properties:
        roleName:
          type: string
        roleKey:
          type: string
        sort:
          type: integer
          default: 0
        dataScope:
          type: integer
          default: 1
        permissionIds:
          type: array
          items:
            type: integer
            format: int64
        remark:
          type: string

    RoleUpdateRequest:
      type: object
      properties:
        roleName:
          type: string
        roleKey:
          type: string
        sort:
          type: integer
        dataScope:
          type: integer
        permissionIds:
          type: array
          items:
            type: integer
            format: int64
        status:
          type: integer
        remark:
          type: string

    RoleResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Role'

    RolePageResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    records:
                      type: array
                      items:
                        $ref: '#/components/schemas/Role'

    Role:
      type: object
      properties:
        id:
          type: integer
          format: int64
        roleName:
          type: string
        roleKey:
          type: string
        sort:
          type: integer
        dataScope:
          type: integer
        status:
          type: integer
        remark:
          type: string
        createTime:
          type: string
          format: date-time

    DepartmentCreateRequest:
      type: object
      required: [name]
      properties:
        parentId:
          type: integer
          format: int64
          default: 0
        name:
          type: string
        leaderId:
          type: integer
          format: int64
        sort:
          type: integer
          default: 0

    DepartmentUpdateRequest:
      type: object
      properties:
        parentId:
          type: integer
          format: int64
        name:
          type: string
        leaderId:
          type: integer
          format: int64
        sort:
          type: integer
        status:
          type: integer

    DepartmentResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Department'

    DepartmentTreeResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DepartmentTree'

    Department:
      type: object
      properties:
        id:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
        name:
          type: string
        leaderId:
          type: integer
          format: int64
        leaderName:
          type: string
        sort:
          type: integer
        status:
          type: integer
        createTime:
          type: string
          format: date-time

    DepartmentTree:
      allOf:
        - $ref: '#/components/schemas/Department'
        - type: object
          properties:
            children:
              type: array
              items:
                $ref: '#/components/schemas/DepartmentTree'

    PermissionCreateRequest:
      type: object
      required: [name, permissionKey, type]
      properties:
        parentId:
          type: integer
          format: int64
          default: 0
        name:
          type: string
        permissionKey:
          type: string
        type:
          type: integer
          description: "1-目录, 2-菜单, 3-按钮"
        path:
          type: string
        component:
          type: string
        icon:
          type: string
        sort:
          type: integer
          default: 0
        visible:
          type: integer
          default: 1

    PermissionResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Permission'

    PermissionTreeResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/PermissionTree'

    Permission:
      type: object
      properties:
        id:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
        name:
          type: string
        permissionKey:
          type: string
        type:
          type: integer
        path:
          type: string
        component:
          type: string
        icon:
          type: string
        sort:
          type: integer
        visible:
          type: integer
        status:
          type: integer

    PermissionTree:
      allOf:
        - $ref: '#/components/schemas/Permission'
        - type: object
          properties:
            children:
              type: array
              items:
                $ref: '#/components/schemas/PermissionTree'
