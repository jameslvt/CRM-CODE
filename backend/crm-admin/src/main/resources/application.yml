# CRM 系统应用配置文件
# Spring Boot 2.7.x

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # Tomcat 配置
  tomcat:
    uri-encoding: UTF-8
    max-threads: 200
    min-spare-threads: 10

# Spring 配置
spring:
  application:
    name: crm-system

  # 环境配置（默认使用 local 环境）
  profiles:
    active: local

  # 解决 Swagger 与 Spring Boot 2.6+ 兼容性问题
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # 数据源配置（使用 Druid 连接池）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://172.24.1.176:3306/crm_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: password01!
    druid:
      # 初始连接数
      initial-size: 5
      # 最小连接池数量
      min-idle: 10
      # 最大连接池数量
      max-active: 20
      # 配置获取连接等待超时的时间
      max-wait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      max-evictable-idle-time-millis: 900000
      # 用来检测连接是否有效的 SQL
      validation-query: SELECT 1 FROM DUAL
      # 建议配置为 true，不影响性能，并且保证安全性
      test-while-idle: true
      # 申请连接时执行 validationQuery 检测连接是否有效
      test-on-borrow: false
      # 归还连接时执行 validationQuery 检测连接是否有效
      test-on-return: false
      # 是否缓存 preparedStatement，也就是 PSCache
      pool-prepared-statements: true
      # 要启用 PSCache，必须配置大于 0
      max-pool-prepared-statement-per-connection-size: 20
      # 配置监控统计拦截的 filters，去掉后监控界面 SQL 无法统计
      filters: stat,wall,slf4j
      # 通过 connectProperties 属性来打开 mergeSql 功能；慢 SQL 记录
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      # 配置 DruidStatFilter
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.bmp,*.png,*.css,*.ico,/druid/*"
      # 配置 DruidStatViewServlet
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        # IP 白名单（没有配置或者为空，则允许所有访问）
        allow: 127.0.0.1
        # IP 黑名单（存在共同时，deny 优先于 allow）
        deny:
        # 禁用 HTML 页面上的 "Reset All" 功能
        reset-enable: false
        # 登录名
        login-username: admin
        # 登录密码
        login-password: admin

  # Redis 配置
  redis:
    host: 172.24.1.176
    port: 6379
    password: JY@pass#01!
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        # 连接池最大连接数（使用负值表示没有限制）
        max-active: 8
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池中的最小空闲连接
        min-idle: 0

  # Jackson 配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略 JSON 中不存在的属性
      fail_on_unknown_properties: false

  # 文件上传配置
  servlet:
    multipart:
      # 单个文件最大大小
      max-file-size: 10MB
      # 请求最大大小
      max-request-size: 100MB

# MyBatis Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类扫描路径
  type-aliases-package: com.crm.*.entity
  # 全局配置
  global-config:
    # 数据库相关配置
    db-config:
      # 主键类型（AUTO: 数据库 ID 自增，INPUT: 用户输入 ID，ASSIGN_ID: 雪花算法全局唯一 ID）
      id-type: ASSIGN_ID
      # 字段策略（NOT_NULL: 非 NULL 判断，NOT_EMPTY: 非空判断）
      insert-strategy: NOT_NULL
      update-strategy: NOT_NULL
      # 逻辑删除配置
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    # 是否控制台打印 MyBatis Plus 的 LOGO
    banner: false
  # 配置
  configuration:
    # 是否开启自动驼峰命名规则映射
    map-underscore-to-camel-case: true
    # 开启 MyBatis 二级缓存
    cache-enabled: false
    # 日志实现
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT 配置
jwt:
  # JWT 密钥（生产环境必须修改）
  secret: crm-system-secret-key-2024-please-change-in-production
  # Token 有效期（单位：秒，默认 7 天）
  expiration: 604800
  # Token Header 名称
  header: Authorization
  # Token 前缀
  prefix: "Bearer "

# 日志配置
logging:
  level:
    root: INFO
    com.crm: DEBUG
    com.crm.system.mapper: DEBUG
    com.crm.business.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/crm-system.log
    max-size: 100MB
    max-history: 30

# Knife4j (Swagger) 配置
knife4j:
  # 是否启用 Knife4j 增强功能
  enable: true
  # 是否生产环境（生产环境建议关闭）
  production: false
  # 基础认证配置
  basic:
    enable: false
    username: admin
    password: admin

# Swagger 配置
springfox:
  documentation:
    swagger-ui:
      enabled: true

# 业务配置
crm:
  # 文件上传路径
  upload-path: /data/crm/upload
  # 文件访问路径
  file-access-url: http://localhost:8080/files
  ai:
    enabled: true
    openai:
      base-url: https://api.openai.com/v1
      api-key: sk-proj-2024-please-change-in-production
      model: gpt-3.5-turbo
      timeout: 60
      max-tokens: 2000
      temperature: 0.7
